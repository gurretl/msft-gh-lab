# Dev Deployment Workflow
# Deploys to dev on push to main

name: Deploy to Dev

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy-dev:
    name: Deploy to Dev
    uses: ./.github/workflows/deploy.yml
    with:
      environment: dev
      azure_env_name: dev
    secrets: inherit
