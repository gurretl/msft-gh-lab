# Prod Deployment Workflow
# Manual trigger for production deployment

name: Deploy to Prod

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "prod" to confirm production deployment'
        required: true
        default: ''

permissions:
  id-token: write
  contents: read

jobs:
  deploy-prod:
    name: Deploy to Prod
    if: ${{ github.event.inputs.confirm == 'prod' }}
    uses: ./.github/workflows/deploy.yml
    with:
      environment: prod
      azure_env_name: prod
    secrets: inherit
