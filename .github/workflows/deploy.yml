# Reusable Azure Deployment Workflow
# See plan/cicd-setup.md and best practices for details

name: Azure Deploy (Reusable)

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      azure_env_name:
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: false

      - name: Set up azd
        uses: Azure/setup-azd@v2

      - name: Ensure azd environment exists
        run: azd env new ${{ inputs.azure_env_name }} --no-prompt --defaults --cwd . || true

      - name: Select azd environment
        run: azd env select ${{ inputs.azure_env_name }}

      - name: Provision infrastructure
        run: azd provision

      - name: Deploy application
        run: azd deploy
